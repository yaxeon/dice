<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>Roll the dice — статичный макет</title>
    <style>
      /* Статичный макет для обсуждения. Логика приложения не реализована. */
      * { box-sizing: border-box; }
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101010;
        color: #f7f7f7;
        -webkit-font-smoothing: antialiased;
      }
      body { margin: 0; }
      .preview {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
      }
      .review-frame { width: min(100%, 390px); }
      .phone {
        width: min(100%, 390px);
        height: 780px;
        max-height: calc(100svh - 100px);
        min-height: 580px;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        background: #000;
        border: 1px solid #292929;
        border-radius: 36px;
        overflow: hidden;
      }
      .stage {
        display: grid;
        padding: 20px 24px 38px;
      }
      .dice-area {
        display: grid;
        place-items: center;
        perspective: 900px;
      }
      .cube {
        --size: 144px;
        --half: calc(var(--size) / 2);
        width: var(--size);
        height: var(--size);
        position: relative;
        transform-style: preserve-3d;
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      }
      .face {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 11px;
        padding: 26px;
        border-radius: 0;
        border: 1px solid #ddd;
        background: #f9f9f9;
        backface-visibility: hidden;
      }
      .front { transform: translateZ(var(--half)); }
      .back { transform: rotateY(180deg) translateZ(var(--half)); }
      .right { transform: rotateY(90deg) translateZ(var(--half)); background: #d5d5d5; border-color: #c3c3c3; }
      .left { transform: rotateY(-90deg) translateZ(var(--half)); }
      .top { transform: rotateX(90deg) translateZ(var(--half)); background: #ededed; }
      .bottom { transform: rotateX(-90deg) translateZ(var(--half)); }
      .pip { width: 100%; aspect-ratio: 1; background: #111; border-radius: 50%; }
      .a { grid-area: 1 / 1; }
      .b { grid-area: 1 / 3; }
      .c { grid-area: 2 / 1; }
      .d { grid-area: 2 / 2; }
      .e { grid-area: 2 / 3; }
      .f { grid-area: 3 / 1; }
      .g { grid-area: 3 / 3; }
      .settings {
        margin: 0 16px;
        padding: 26px 0 32px;
        border-top: 1px solid #222;
        display: grid;
        grid-template-columns: minmax(0, 3fr) 1px minmax(0, 4fr);
        align-items: center;
        gap: 10px;
      }
      .setting {
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr);
        align-items: center;
        gap: 6px;
      }
      .setting-icon {
        display: block;
        width: 20px;
        height: 20px;
        color: #aaa;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .settings-divider { width: 1px; height: 24px; background: #333; }
      .segments {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 2px;
        padding: 3px;
        border-radius: 13px;
        background: #151515;
      }
      .segment {
        min-height: 44px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        color: #aaa;
        font-size: 16px;
        font-weight: 500;
        line-height: 1;
      }
      .selected { background: #f9f9f9; color: #111; }
      @media (max-width: 480px) {
        :root { background: #000; }
        .preview { display: block; padding: 0; }
        .review-frame { width: 100%; }
        .phone {
          width: 100%;
          height: 100svh;
          max-height: none;
          min-height: 0;
          border: 0;
          border-radius: 0;
        }
        .stage { padding-top: calc(20px + env(safe-area-inset-top)); }
        .settings { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
      }
      @media (max-height: 580px) {
        .stage { padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: 16px; }
        .cube { --size: 104px; }
        .face { padding: 18px; gap: 8px; }
        .settings { padding-top: 16px; padding-bottom: 16px; }
      }
      @media (max-width: 360px) {
        .settings { margin-inline: 12px; gap: 8px; }
        .setting { grid-template-columns: 18px minmax(0, 1fr); gap: 4px; }
        .setting-icon { width: 18px; height: 18px; }
        .segment { font-size: 15px; }
      }
      @media (orientation: landscape) and (max-height: 580px) {
        .preview { padding: 0; }
        .review-frame { width: 100%; }
        .phone {
          width: 100%;
          height: 100svh;
          max-height: none;
          min-height: 0;
          border: 0;
          border-radius: 0;
        }
        .settings { width: min(calc(100% - 32px), 420px); margin-inline: auto; }
      }
    </style>
  </head>
  <body>
    <div class="preview">
      <div class="review-frame">
        <main class="phone" aria-label="Статичный макет приложения Roll the dice">
          <section class="stage" aria-label="Пример результата броска">
            <div class="dice-area">
              <div class="cube" role="img" aria-label="Белый кубик, результат — пять">
                <div class="face front" aria-hidden="true">
                  <i class="pip a"></i><i class="pip b"></i><i class="pip d"></i><i class="pip f"></i><i class="pip g"></i>
                </div>
                <div class="face back" aria-hidden="true"><i class="pip a"></i><i class="pip g"></i></div>
                <div class="face right" aria-hidden="true"><i class="pip a"></i><i class="pip d"></i><i class="pip g"></i></div>
                <div class="face left" aria-hidden="true"><i class="pip a"></i><i class="pip b"></i><i class="pip f"></i><i class="pip g"></i></div>
                <div class="face top" aria-hidden="true"><i class="pip d"></i></div>
                <div class="face bottom" aria-hidden="true"><i class="pip a"></i><i class="pip b"></i><i class="pip c"></i><i class="pip e"></i><i class="pip f"></i><i class="pip g"></i></div>
              </div>
            </div>
          </section>
          <!-- Переключатели изображены статично и не являются рабочими контролами. -->
          <footer class="settings" aria-label="Пример настроек: один кубик, шесть граней">
            <div class="setting" role="group" aria-label="Количество кубиков">
              <svg class="setting-icon" viewBox="0 0 24 24" aria-hidden="true">
                <g stroke-width="1.25">
                  <rect x="7.5" y="1" width="9" height="9" rx="1.8"/>
                  <rect x="1" y="13" width="9" height="9" rx="1.8"/>
                  <rect x="14" y="13" width="9" height="9" rx="1.8"/>
                </g>
                <g fill="currentColor" stroke="none">
                  <circle cx="12" cy="5.5" r=".85"/>
                  <circle cx="3.5" cy="15.5" r=".8"/>
                  <circle cx="7.5" cy="19.5" r=".8"/>
                  <circle cx="16.5" cy="15.5" r=".8"/>
                  <circle cx="18.5" cy="17.5" r=".8"/>
                  <circle cx="20.5" cy="19.5" r=".8"/>
                </g>
              </svg>
              <div class="segments" aria-label="Количество кубиков">
                <span class="segment selected" aria-label="Один кубик, выбран">1</span>
                <span class="segment">2</span>
                <span class="segment">3</span>
              </div>
            </div>
            <span class="settings-divider" aria-hidden="true"></span>
            <div class="setting" role="group" aria-label="Количество граней">
              <svg class="setting-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <g fill="currentColor" stroke="none">
                  <circle cx="8" cy="7" r="1.2"/>
                  <circle cx="16" cy="7" r="1.2"/>
                  <circle cx="8" cy="12" r="1.2"/>
                  <circle cx="16" cy="12" r="1.2"/>
                  <circle cx="8" cy="17" r="1.2"/>
                  <circle cx="16" cy="17" r="1.2"/>
                </g>
              </svg>
              <div class="segments" aria-label="Количество граней">
                <span class="segment">4</span>
                <span class="segment selected" aria-label="Шесть граней, выбрано">6</span>
                <span class="segment">8</span>
                <span class="segment">10</span>
              </div>
            </div>
          </footer>
        </main>
      </div>
    </div>
  </body>
</html>
